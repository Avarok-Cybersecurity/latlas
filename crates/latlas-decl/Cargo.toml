[package]
name = "latlas-decl"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Latlas: the declarative pack: markdown tables and a Rust workspace read into a bundle from `.latlas/config.toml` alone (no pack code per repository). no_std + alloc, no I/O."

[dependencies]
latlas-check = { workspace = true }
latlas-core = { workspace = true }
latlas-error = { workspace = true }
serde = { workspace = true, features = ["alloc", "derive"] }
serde_json = { workspace = true, features = ["alloc"] }
toml = { workspace = true, features = ["serde", "parse"] }

[lints]
workspace = true
