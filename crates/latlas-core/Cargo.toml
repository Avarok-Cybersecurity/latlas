[package]
name = "latlas-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Latlas: the pure core: typed ids over an open vocabulary, the bundle, the pack contract, closures, hybrid ranking and status sections. no_std + alloc, no I/O."

[dependencies]
latlas-error = { workspace = true }
latlas-ports = { workspace = true }
libm = { workspace = true }
serde = { workspace = true, features = ["alloc", "derive"] }
serde_json = { workspace = true, features = ["alloc"] }
sha2 = { workspace = true, features = ["alloc"] }
toml = { workspace = true, features = ["serde", "parse"] }

[lints]
workspace = true
