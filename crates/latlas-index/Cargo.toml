[package]
name = "latlas-index"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Latlas: the derived LatticeDB index of a bundle: the graph collection, the content-hash embedding cache and the read-only Cypher gate."

[dependencies]
lattice-core = { workspace = true }
lattice-storage = { workspace = true, features = ["native"] }
latlas-core = { workspace = true }
latlas-error = { workspace = true }
serde_json = { workspace = true, features = ["std"] }

# 2026-10-23: The textstore round-trip test runs the async store on a current-thread runtime.
[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }

[lints]
workspace = true
